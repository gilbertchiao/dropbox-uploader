name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write # 讓 golangci-lint-action 能以 annotation/check run 形式回報結果

jobs:
  test:
    name: 測試與格式
    runs-on: ubuntu-latest
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 檢查 gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下檔案未通過 gofmt，請在本地執行 gofmt -w 後再提交："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
